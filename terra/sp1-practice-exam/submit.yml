    required:
        'sp1_practice_exam.py': |
            # Scientific Programming 1, practice exam
            # Name: ...

            print("Welcome to the practice exam!")

        'temp.py': |
            # This file will be ignored by us. You can use this as a canvas
            # for drafts and test out code fragments.

        'sp1_practice_examTest.py': |
            # DO NOT EDIT THIS FILE.
            # These are the tests that the Checkpy button runs on sp1_practice_exam.py.
            # If you change this file, Checkpy no longer checks your solutions correctly.

















































































            from checkpy import *
            import ast

            only("sp1_practice_exam.py")
            include("barca.txt", "barca_short.txt")

            # Practice exam 1

            # Q1
            fun1_def = (declarative
                .function("collatz")
                .params("number")
                .returnType(list)
            )

            test1_1 = test()(fun1_def.call(3).returns([10, 5, 16, 8, 4, 2, 1]))
            test1_2 = test()(fun1_def.call(16).returns([8, 4, 2, 1]))

            # With / instead of //, the numbers become floats: 5.0 == 5, so check the type too.
            @test()
            def test1_3():
                """collatz(7) returns a list of integers"""
                collatz = getFunction("collatz")
                result = collatz(7)
                assert result == [22, 11, 34, 17, 52, 26, 13, 40, 20, 10, 5, 16, 8, 4, 2, 1]
                assert all(type(number) == int for number in result), "the list contains floats: use // instead of /"


            # Q2
            fun2_def = (declarative
                .function("swap_words")
                .params("text")
                .returnType(str)
            )

            test2_1 = test()(fun2_def.call("Why is a raven like a writing desk?").returns("is Why raven a a like desk? writing"))
            test2_2 = test()(fun2_def.call("You can always take more than nothing.").returns("can You take always than more nothing."))

            # Boundary: a single word stays as it is.
            test2_3 = test()(fun2_def.call("Hello").returns("Hello"))


            # Q3
            fun3_def = (declarative
                .function("words_of_length")
                .params("words", "lengths")
                .returnType(list)
            )

            # The order follows words, not lengths.
            test3_1 = test()(fun3_def
                .call(["one", "two", "three", "four", "five", "six", "seven"], [5, 3])
                .returns(["one", "two", "three", "six", "seven"])
            )

            # A length that occurs twice must not add a word twice.
            test3_2 = test()(fun3_def
                .call(["cat", "horse", "dog", "mouse", "bird"], [3, 5, 3])
                .returns(["cat", "horse", "dog", "mouse"])
            )

            # Boundary: no word has a matching length.
            test3_3 = test()(fun3_def
                .call(["apple", "fig", "banana"], [2, 4])
                .returns([])
            )

            # The sheet forbids the `in` operator inside words_of_length. A `for ... in ...` loop is not an
            # `in` comparison, so it is not flagged; grading is manual anyway.
            @test()
            def test3_4():
                """words_of_length does not use the in operator"""
                tree = ast.parse(static.getSource())
                definitions = [node for node in ast.walk(tree)
                               if isinstance(node, ast.FunctionDef) and node.name == "words_of_length"]
                for node in (inner for definition in definitions for inner in ast.walk(definition)):
                    if isinstance(node, ast.Compare) and any(isinstance(op, (ast.In, ast.NotIn)) for op in node.ops):
                        raise AssertionError(f"the in operator is not allowed here: {ast.unparse(node)}")


            # Practice exam 2

            # Q1
            fun4_def = (declarative
                .function("bounce")
                .params("n")
                .returnType(list)
            )

            test4_1 = test()(fun4_def.call(20).returns([1.0, 4.0, 16.0, 64.0, 256.0, 128.0, 64.0, 32.0, 16.0, 8.0, 4.0, 2.0,
                                                        1.0, 4.0, 16.0, 64.0, 256.0, 128.0, 64.0, 32.0]))

            # Boundary: just the starting number.
            test4_2 = test()(fun4_def.call(1).returns([1.0]))
            test4_3 = test()(fun4_def.call(5).returns([1.0, 4.0, 16.0, 64.0, 256.0]))


            # Q2
            fun5_def = (declarative
                .function("gregory_leibniz")
                .params("n")
                .returnType(float)
            )

            test5_1 = test()(fun5_def.call(1).returns(approx(4.0)))
            test5_2 = test()(fun5_def.call(10).returns(approx(3.0418396189294032)))
            test5_3 = test()(fun5_def.call(1000000).returns(approx(3.1415916535897743)))


            # Q3
            fun6_def = (declarative
                .function("home_advantage")
                .params("filename")
                .returnType(int)
            )

            test6_1 = test()(fun6_def.call("barca_short.txt").returns(2))
            test6_2 = test()(fun6_def.call("barca.txt").returns(15))


