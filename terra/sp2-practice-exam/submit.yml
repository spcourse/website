            from checkpy import *
            import io
            import contextlib

            only("sp2_practice_exam.py")

            # Q1
            fun1_def = (declarative
                .function("combine_dicts")
                .params("dict1", "dict2")
                .returnType(dict)
            )

            english_to_french = {'banana': 'banane', 'apple': 'pomme', 'almond': 'amande', 'cat': 'chat', 'fine': 'amande'}
            french_to_spanish = {'pomme': 'manzana', 'car': 'coche', 'banane': 'plátano', 'amande': 'almendra'}

            test1_1 = test()(fun1_def
                .call(english_to_french, french_to_spanish)
                .returns({'banana': 'plátano', 'apple': 'manzana', 'almond': 'almendra', 'fine': 'almendra'})
            )

            # The keys of the second dictionary do not end up in the result.
            test1_2 = test()(fun1_def
                .call({'one': 'een', 'two': 'twee'}, {'twee': 'deux', 'drie': 'trois'})
                .returns({'two': 'deux'})
            )

            # Boundary: no translation can be found.
            test1_3 = test()(fun1_def
                .call({'dog': 'hond'}, {'kat': 'chat'})
                .returns({})
            )


            # Q2
            # A list instead of a set is fine, and so is either order within a pair, but each pair must occur once.
            class UnorderedPairs:
                def __init__(self, pairs):
                    self._original = pairs
                    self._pairs = self._normalise(pairs)

                @staticmethod
                def _normalise(pairs):
                    return sorted(tuple(sorted(pair)) for pair in pairs)

                def __eq__(self, other):
                    try:
                        return self._pairs == self._normalise(other)
                    except TypeError:
                        return False

                def __repr__(self):
                    return repr(self._original)

            fun2_def = (declarative
                .function("find_pairs_with_duplicate_values")
                .params("mapping")
            )

            mapping = {"noodle": "long thin pasta",
                       "Ferrari F40": "expensive supercar",
                       "spaghetti": "long thin pasta",
                       "Casio F-91W": "popular watch",
                       "McLaren F1": "expensive supercar",
                       "vermicelli": "long thin pasta",
                       "novel": "something to read"}

            test2_1 = test()(fun2_def
                .call(mapping)
                .returns(UnorderedPairs({('noodle', 'spaghetti'), ('Ferrari F40', 'McLaren F1'),
                                         ('noodle', 'vermicelli'), ('spaghetti', 'vermicelli')}))
            )

            # Four keys with the same value make six pairs; a key is never paired with itself.
            test2_2 = test()(fun2_def
                .call({"a": 1, "b": 1, "c": 1, "d": 1, "e": 2})
                .returns(UnorderedPairs({("a", "b"), ("a", "c"), ("a", "d"), ("b", "c"), ("b", "d"), ("c", "d")}))
            )

            # Boundary: all values are different.
            test2_3 = test()(fun2_def
                .call({"x": 1, "y": 2, "z": 3})
                .returns(UnorderedPairs(set()))
            )


            # Q3
            EUROPE = [("Italy",   2107702.84,  688582.42),
                      ("France",  2957879.76,  871058.67),
                      ("U.K.",    3131377.76,  875196.92),
                      ("Germany", 4259934.91, 2003471.01),
                      ("Spain",   1427380.68,  498633.85)]
            ASIA = [("Kazakhstan",  197112.26,   66124.96),
                    ("India",      3176295.07,  679680.59),
                    ("Mongolia",     15286.44,    8950.04),
                    ("China",     17734062.65, 3553509.24),
                    ("Indonesia",  1186092.99,  255731.27)]

            def make_continent(name, countries):
                Country = getModule().Country._function
                Continent = getModule().Continent._function
                continent = Continent(name)
                for country in countries:
                    continent.add_country(Country(*country))
                return continent

            @test()
            def test3_1():
                """a Country has the attributes name, gdp and export, and computes its export as % of GDP"""
                Country = getModule().Country._function
                kazakhstan = Country("Kazakhstan", 197112.26, 66124.96)
                assert kazakhstan.name == "Kazakhstan"
                assert kazakhstan.gdp == 197112.26
                assert kazakhstan.export == 66124.96
                assert kazakhstan.export_as_percentage_of_gdp() == approx(33.54685294562601)

            @test()
            def test3_2():
                """print_info prints the example format"""
                Country = getModule().Country._function
                output = io.StringIO()
                with contextlib.redirect_stdout(output):
                    Country("Kazakhstan", 197112.26, 66124.96).print_info()
                expected = "Country: Kazakhstan; gdp: 197112.26; export: 66124.96; export as % of gdp: 33.54685294562601"
                assert output.getvalue().strip() == expected

            @test()
            def test3_3():
                """a Continent has a name and a list of countries; find_country returns the Country, or None"""
                Continent = getModule().Continent._function
                empty = Continent("Antarctica")
                assert empty.name == "Antarctica"
                assert empty.countries == [], "countries should start empty"

                asia = make_continent("Asia", ASIA)
                assert [country.name for country in asia.countries] == [country[0] for country in ASIA]
                assert asia.find_country("Mongolia").name == "Mongolia"
                assert asia.find_country("Italy") is None, 'find_country("Italy") should return None for Asia'

            @test()
            def test3_4():
                """total_export_as_percentage_of_gdp and get_countries_with_export_below work for the example"""
                asia = make_continent("Asia", ASIA)
                europe = make_continent("Europe", EUROPE)
                # The total over all countries, not the average of the percentages (which is 31.02).
                assert asia.total_export_as_percentage_of_gdp() == approx(20.46, abs=0.005)

                below = europe.get_countries_with_export_below(700000)
                assert [country.name for country in below] == ["Italy", "Spain"]
                assert [country.name for country in asia.get_countries_with_export_below(10000)] == ["Mongolia"]
