templates:
    1: &auto
        type: float
        subgrades:
            points: integer
        calculation: points
        automatic:
            points: (correctness_score * 10).floor
        auto_publish: true
        hide_calculated: true
        hide_subgrades: false

    2: &check
        type: boolean
        subgrades:
