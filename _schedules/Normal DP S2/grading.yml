templates:
    1: &auto
        type: float
        subgrades:
            points: integer
        calculation: (points >= 9) && points || 0
        automatic:
            points: (correctness_score * 10).floor
        auto_publish: true
        hide_calculated: false
        hide_subgrades: false

    2: &check
        type: boolean
        subgrades:
            passed: boolean
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

    3: &testt
        type: boolean
        subgrades:
            passed: boolean
            checkpy: float
        automatic:
            checkpy: correctness_score * 10
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

    5: &graded
        hide_calculated: true
        type: float
        subgrades:
            code_quality: integer
            correctness: integer
        calculation: "1.0 + 9.0 * (3.0 * correctness + 2.0 * code_quality - 5.0) / 20.0"


grades:
    #### DP ####
    m7-passed: 
        type: float
        subgrades:
            base_correct: boolean
            creative: boolean
            experiment: boolean
            visualize: boolean
        calculation: "1.0 + base_correct * -6.0 + creative * -1.0 + experiment * - 1.0 + visualize * -1.0"
    m8-passed:
        type: float
        subgrades:
            base_correct: boolean
            crawling: boolean
            bbc: boolean
        calculation: "1.0 + base_correct * -6.0 + crawling * -2.0 + bbc * - 1.0"
    m9-passed: *check
    m10-passed: *check
    project:
        type: float
        subgrades:
            research_question: integer
            complexity: integer
            novelty: integer
            quality: integer
        calculation: "(9.0/12.0 * (novelty + quality + complexity + research_question) + 1).round(1)"

    7_1p: *auto
    7_2p: *auto
    c-creative: *check
    c-experiment: *check
    c-visualize: *check

    8_1w: *check
    8_2w: *check
    c-crawling: *check
    c-bbc: *check

    9_1t: *check
    9_2t: *check

    10_1d: *auto
    10_2d: *auto

    p_1p: *check
    p_2p: *check
    p_3p: *check
    p_4p: *check

    #### SP 1 ####
    m1-passed: *check
    m2-passed: *check
    m3-passed: *check

    sp1_exam1: *testt
    sp1_exam2: *testt
    sp1_exam3: *testt
    sp1_exam4: *testt

    #### SP 2 ####
    m4-passed: *check
    m5-passed: *check
    m6-passed: *check

    sp2_exam1: *testt
    sp2_exam2: *testt
    sp2_exam3: *testt
    sp2_exam4: *testt

    #### FINAL GRADES ####
    final_sp1_1: *check
    final_sp1_2: *check
    final_sp1_3: *check
    final_sp1_4: *check

    final_sp2_1: *check
    final_sp2_2: *check
    final_sp2_3: *check
    final_sp2_4: *check




