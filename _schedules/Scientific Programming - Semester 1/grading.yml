templates:
    1: &auto
        type: float
        subgrades:
            points: integer
        calculation: (points >= 9) && points || 0
        automatic:
            points: (correctness_score * 10).floor
        auto_publish: true
        hide_calculated: false
        hide_subgrades: false

    2: &check
        type: boolean
        subgrades:
            passed: boolean
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

    3: &testt
        type: boolean
        subgrades:
            passed: boolean
            checkpy: float
        automatic:
            checkpy: correctness_score * 10
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

    5: &graded
        hide_calculated: true
        type: float
        subgrades:
            code_quality: integer
            correctness: integer
        calculation: "1.0 + 9.0 * (3.0 * correctness + 2.0 * code_quality - 5.0) / 20.0"


grades:
    m1-passed: *check
    m2-passed: *check
    m3-passed: *check

    1_1a: *auto
    1_2a: *auto
    1_3a: *auto
    1_4a: *auto
    1_5a: *auto
    1_6a: *auto
    c-pyramid: *auto
    c-conway: *auto

    
sp1_checks:
    show_progress: true
    submits:
        m1-passed: 1
        m2-passed: 1
        m3-passed: 1


sp1_level_1_algorithms :
    show_progress: true
    small_block_overview: true
    submits:
        1_1a: 1
        1_2a: 1
        1_3a: 1
        1_4a: 1
        1_5a: 1
        1_6a: 1


sp1_level_1_challenges:
    show_progress: true
    small_block_overview: true
    submits:
        c-pyramid: 1
        c-conway: 1

