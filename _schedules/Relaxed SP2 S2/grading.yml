templates:
  1: &auto
    type: float
    subgrades:
      points: integer
    calculation: (points >= 9) && points || 0
    automatic:
      points: (correctness_score * 10).floor
    auto_publish: true
    hide_calculated: false
    hide_subgrades: false

  2: &check
    type: pass
    subgrades:
      passed: boolean
    calculation: passed
    auto_publish: true
    hide_calculated: true
    hide_subgrades: false

  3: &testt
    type: pass
    subgrades:
      passed: boolean
      checkpy: float
    automatic:
      checkpy: correctness_score * 10
    calculation: passed
    auto_publish: false
    hide_calculated: true
    hide_subgrades: false

  5: &graded
    hide_calculated: true
    type: float
    subgrades:
      code_quality: integer
      correctness: integer
    calculation: "1.0 + 9.0 * (3.0 * correctness + 2.0 * code_quality - 5.0) / 20.0"

grades:
  #### SP 1 ####
  m1-passed: *check
  m2-passed: *check
  m3-passed: *check

  #### SP 2 ####
  m4-passed: *check
  m5-passed: *check
  m6-passed: *check

  4_1m: *auto
  4_2m: *auto
  c-animation: *check
  c-monopoly-n-player: *check

  5_1m: *auto
  5_2m: *auto
  5_3m: *check
  c-counting-visits: *check
  c-datastructures2: *auto
  c-monopoly2-n-player: *check

  6_1s: *check
  6_2s: *check
  6_3s: *check

  sp2_practice_exam: *auto

  sp2_exam1: *testt
  sp2_exam2: *testt
  sp2_exam3: *testt
  sp2_exam4: *testt

  final_sp2_3: *check
  final_sp2_4: *check

  #### DP ####
  7_1p: *auto
  7_2p: *auto
  c-experiment: *check

  #### FINAL GRADES ####
  final_sp1_1: *check
  final_sp1_2: *check
  final_sp1_3: *check
  final_sp1_4: *check

  final_sp2_1: *check
  final_sp2_2: *check
  final_sp2_3: *check
  final_sp2_4: *check

########### SP 1 ###########

