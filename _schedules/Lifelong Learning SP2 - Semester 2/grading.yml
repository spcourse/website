templates:
    1: &auto
        type: float
        subgrades:
            points: integer
        calculation: (points >= 9) && points || 0
        automatic:
            points: (correctness_score * 10).floor
        auto_publish: true
        hide_calculated: false
        hide_subgrades: false

    2: &check
        type: boolean
        subgrades:
            passed: boolean
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

    3: &testt
        type: boolean
        subgrades:
            passed: boolean
            checkpy: float
        automatic:
            checkpy: correctness_score * 10
        calculation: passed
        auto_publish: false
        hide_calculated: true
        hide_subgrades: false

grades:
    4_1-animation: *auto
    4_3-monopoly-2: *auto
    4_4-monopoly-3: *auto

    5_1-datastructures: *auto
    5_2-complexity: *check
    5_3-unique-word:
        type: float
        subgrades:
            points: integer
        calculation: (points >= 8) && points || 0
        automatic:
            points: (correctness_score * 10).floor
        auto_publish: true
        hide_calculated: false
        hide_subgrades: false

    c-tf-idf: *check
    c-generate-word-list: *check

    6_2-notebook: *check
    6_3-pandas: *check
    6_4-seaborn: *check
    6_5-survival: *check


    m4-passed: *check
    m5-passed: *check
    m6-passed: *check

    sp2_exam3: *testt
    sp2_exam4: *testt

sp2_level_4_monopoly:
    show_progress: true
    submits:
        4_1-animation: 10
        4_3-monopoly-2: 10
        4_4-monopoly-3: 10

sp2_level_5_shakespeare:
    show_progress: true
    submits:
        5_1-datastructures: 10
        5_2-complexity: 10
        5_3-unique-word: 10
        c-tf-idf: 10
        c-generate-word-list: 10

sp2_level_6_survival:
    show_progress: true
    submits:
        6_2-notebook: 10
        6_3-pandas: 10
        6_4-seaborn: 10
        6_5-survival: 10

sp2_checks:
    show_progress: true
    submits:
        m4-passed: 1
        m5-passed: 1
        m6-passed: 1
        sp2_exam3: 1
        sp2_exam4: 1
