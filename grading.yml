####### SP final grade stuff -> kan dit hier?

sp1_checks:
    type: pass_all        # alles moet pass zijn
    submits:
        - m1-passed
        - m2-passed
        - m3-passed

sp1_exams:
    type: pass_first      # minimaal één gedaan (pass/fail), gebruik eerste
    submits:
        - sp1_exam1
        - sp1_exam2
        - sp1_exam3
        - sp1_exam4

sp1_exams_resit:
    type: pass_last       # minimaal twee gedaan (pass/fail), gebruik laatste
    submits:
        - sp1_exam1
        - sp1_exam2
        - sp1_exam3
        - sp1_exam4


sp2_checks:
    type: pass_all        # alles moet pass zijn
    submits:
        - m4-passed
        - m5-passed
        - m6-passed

sp2_exams:
    type: pass_first      # minimaal één gedaan (pass/fail), gebruik eerste
    submits:
        - sp2_exam1
        - sp2_exam2
        - sp2_exam3
        - sp2_exam4

sp2_exams_resit:
    type: pass_last       # minimaal twee gedaan (pass/fail), gebruik laatste
    submits:
        - sp2_exam1
        - sp2_exam2
        - sp2_exam3
        - sp2_exam4

########## FINAL GRADES ###########

calculation:
    sp1_final:
        type: pass
        components:
            - sp1_checks
            - sp1_exams

    sp1_resit:
        type: pass
        components:
            - sp1_checks
            - sp1_exams_resit

    sp2_final:
        type: pass
        components:
            - sp1_checks
            - sp1_exams

    sp2_resit:
        type: pass
        components:
            - sp1_checks
            - sp1_exams_resit
